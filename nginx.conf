server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # el visor pesa ~4 MB; comprimirlo lo baja a ~1 MB en tránsito
    gzip on;
    gzip_types text/html application/json;
    gzip_min_length 1024;

    # JSON consultable desde navegadores/agentes de cualquier origen
    location /data/ {
        add_header Access-Control-Allow-Origin *;
    }
}
